<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KTMEX | Poka-Yoke TABC / TMMBC</title>
<style>
    :root {
        --bg-main: #1a1b21;
        --bg-panel: #25262c;
        --border-dashed: #4a4b50;
        --red-step: #ff0b21;
        --blue-btn: #007bff;
        --text-main: #ffffff;
        --text-muted: #8b949e;
        --bg-pill: #2a2b32;
        --green-ok: #10b981;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* VISTA DE LOGIN */
    .login-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        flex: 1;
    }
    .input-box {
        width: 100%;
        background-color: var(--bg-pill);
        border: 1px solid var(--border-dashed);
        border-radius: 8px;
        padding: 14px;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 700;
        outline: none;
        margin-bottom: 15px;
        text-align: center;
    }
    .input-box:focus {
        border-color: var(--blue-btn);
    }

    /* HEADER Y CHIP DE USUARIO */
    .scan-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px 5px 20px;
    }
    .step-title {
        color: var(--green-ok);
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 0.5px;
    }
    .user-pill {
        background-color: var(--bg-pill);
        color: var(--text-muted);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    /* BARRITAS DE PROGRESO */
    .progress-container {
        display: flex;
        gap: 8px;
        padding: 0 20px;
        margin-top: 10px;
        margin-bottom: 25px;
    }
    .progress-bar {
        flex: 1;
        height: 6px;
        background-color: #3f4048;
        border-radius: 4px;
        transition: all 0.3s ease;
    }
    .progress-bar.active {
        background-color: var(--green-ok);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    /* CAJA PRINCIPAL DE ESCANEO */
    .workspace {
        flex: 1;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
    }
    .scan-box-dashed {
        background-color: var(--bg-panel);
        border: 2px dashed var(--border-dashed);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 160px;
        margin-bottom: 25px;
        padding: 20px;
        text-align: center;
        position: relative;
    }
    .scan-prompt-text {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-main);
        text-transform: uppercase;
        margin: 0;
    }
    .scan-sub-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 8px;
        font-weight: 600;
        word-break: break-all;
    }

    /* BOTONES Y ETIQUETAS */
    .btn-blue-large {
        background-color: var(--blue-btn);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 800;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        margin-bottom: 20px;
    }
    .btn-blue-large:active {
        background-color: #0062cc;
    }
    .btn-green { background-color: var(--green-ok); }

    .scanner-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--green-ok);
        background: rgba(16, 185, 129, 0.1);
        border: 1px dashed var(--green-ok);
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 20px;
        text-align: center;
    }

    .intentos-text {
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 700;
    }

    /* ESTILOS DE INPUT OCULTO SEGURO */
    .scanner-input-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
    }

    /* ELEMENTOS DEL PASO 4 */
    .img-verify {
        width: 100%;
        height: 140px;
        object-fit: contain;
        border-radius: 6px;
        margin-bottom: 10px;
        background: var(--bg-pill);
    }
    .tekin-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
    }
    .option-btn {
        background: var(--bg-pill);
        border: 1.5px solid var(--blue-btn);
        color: var(--text-main);
        padding: 14px 8px;
        border-radius: 6px;
        font-weight: 800;
        cursor: pointer;
    }

    /* POPUPS Y BLOQUEO */
    #msg-pop {
        position: absolute;
        top: -40px;
        background: rgba(255, 11, 33, 0.2);
        border: 1px solid var(--red-step);
        color: #ff6b7b;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 12px;
        display: none;
        z-index: 50;
    }
    .lock-ui {
        position: fixed;
        inset: 0;
        background: #140808;
        border: 4px solid var(--red-step);
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
</style>
</head>
<body>

<!-- VISTA 1: LOGIN -->
<div id="ui-login" class="login-container">
    <h2 style="text-align:center; color:var(--green-ok); margin-bottom: 30px;">KTMEX POKA-YOKE</h2>
    <input type="text" id="nom-input" class="input-box" placeholder="ESCRIBIR O ESCANEAR NÓMINA" autocomplete="off" autofocus>
    <div id="pin-box" style="display:none;">
        <input type="password" id="pin-input" class="input-box" placeholder="PIN DE LÍDER" autocomplete="off">
    </div>
    <div id="login-msg" style="color:var(--red-step); font-size:12px; font-weight:700; text-align:center; min-height:20px; margin-bottom:10px;"></div>
    <button id="btn-login" type="button" class="btn-blue-large">INGRESAR</button>
</div>

<!-- VISTA 2: FLUJO DE ESCANEO -->
<div id="ui-scan" style="display:none; flex-direction:column; height:100%;">

    <!-- HEADER -->
    <div class="scan-header">
        <h1 id="header-step-title" class="step-title">PASO 1: JAMAITA</h1>
        <div id="user-display" class="user-pill">Operador</div>
    </div>

    <!-- BARRITAS -->
    <div class="progress-container">
        <div class="progress-bar active" id="bar-1"></div>
        <div class="progress-bar" id="bar-2"></div>
        <div class="progress-bar" id="bar-3"></div>
        <div class="progress-bar" id="bar-4"></div>
    </div>

    <div class="workspace">

        <!-- RECEPTOR OCULTO ZEBRA -->
        <input type="text" id="zebra-wedge-input" inputmode="none" autocomplete="off" class="scanner-input-hidden">

        <!-- ÁREA CENTRAL DE ESCANEO -->
        <div class="scan-box-dashed" id="scan-container">
            <div id="msg-pop">ERROR DE LECTURA</div>

            <!-- Texto para pasos -->
            <h2 id="main-prompt" class="scan-prompt-text">ESPERANDO ESCANEO...</h2>
            <div id="sub-prompt" class="scan-sub-text"></div>

            <!-- Interfaz Tekin para paso 4 -->
            <div id="step4-container" style="display:none; width:100%; flex-direction:column; align-items:center;">
                <img id="img-tekin" class="img-verify" alt="Referencia Tekin">
                <div id="options-area" class="tekin-options"></div>
            </div>
        </div>

        <!-- CONTROLES INFERIORES -->
        <div id="btn-manual-trigger" class="scanner-indicator">
            <span>📡</span> ESPERANDO ESCÁNER FÍSICO
        </div>

        <!-- Botones ocultos por avance automático -->
        <button id="btn-res" class="btn-blue-large btn-green" style="display:none;">CONTINUAR AL SIGUIENTE PASO</button>
        <button id="btn-finish" class="btn-blue-large btn-green" style="display:none;">FINALIZAR PIEZA</button>

        <div id="retry-counter" class="intentos-text">Intentos: 0/5</div>
    </div>
</div>

<!-- BLOQUEO DE SEGURIDAD -->
<div id="lock" class="lock-ui">
    <h2 style="color:var(--red-step); font-weight:900;">BLOQUEO DE SEGURIDAD</h2>
    <p id="lock-msg" style="color:white; font-weight:700; margin-bottom: 20px;">EXCESO DE INTENTOS</p>
    <input type="password" id="pin-tl" class="input-box" style="max-width:280px;" placeholder="PIN DE LÍDER">
    <button id="btn-unlock" type="button" class="btn-blue-large" style="background-color:var(--red-step); max-width:280px;">DESBLOQUEAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { initializeFirestore, doc, getDoc, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6Il03GHS4L_eDY1Kv3fMyF2EwuYLQ5qY",
        authDomain: "logistica-ktmex.firebaseapp.com",
        databaseURL: "https://logistica-ktmex-default-rtdb.firebaseio.com",
        projectId: "logistica-ktmex",
        storageBucket: "logistica-ktmex.firebasestorage.app",
        messagingSenderId: "166597623735",
        appId: "1:166597623735:web:3eace2ff8efec0f081b232",
        measurementId: "G-4YYT138NFR"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1GkWY2r-kz_wfv_-LPEeFEdKe1qNILTV86pln2xg_rIM/gviz/tq?tqx=out:csv";

    // Clientes habilitados en esta app
    const ALLOWED_CLIENTS = new Set(["TABC", "TMMBC"]);

    let sheetData = [], usersCache = {};
    let user = null, step = 1, jamaita = "", kanbanParte = "", idCliente = "", expectedIdCliente = "", clienteFinal = "";
    let activeSheetRow = null, pendingData = null, retryCount = 0, paused = false;

    // 1. INICIALIZACIÓN
    async function initBackgroundResources() {
        try {
            const localSheet = localStorage.getItem('ktmex_sheet');
            if (localSheet) sheetData = JSON.parse(localSheet);
            const localUsers = localStorage.getItem('ktmex_users');
            if (localUsers) usersCache = JSON.parse(localUsers);
        } catch (e) {}

        fetch(SHEET_CSV_URL).then(res => res.text()).then(data => { 
            sheetData = parseCSV(data);
            try { localStorage.setItem('ktmex_sheet', JSON.stringify(sheetData)); } catch (e) {}
        }).catch(function(e) {});

        // Precarga de usuarios desde la misma colección "Usuarios" de Firebase
        try {
            const snapUsers = await getDocs(collection(db, "Usuarios"));
            snapUsers.forEach(d => {
                usersCache[d.id] = d.data();
                usersCache[d.id.toUpperCase()] = d.data();
            });
            try { localStorage.setItem('ktmex_users', JSON.stringify(usersCache)); } catch (e) {}
        } catch (e) {}
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        return lines.map(line => {
            const result = [];
            let cell = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { result.push(cell.trim().replace(/^"|"$/g, '')); cell = ''; } 
                else { cell += char; }
            }
            result.push(cell.trim().replace(/^"|"$/g, ''));
            return result;
        });
    }

    // 2. LOGIN (IDÉNTICO AL ORIGINAL CON CONEXIÓN A COLECCIÓN "Usuarios" DE FIREBASE)
    async function checkLogin() {
        const nomInput = document.getElementById('nom-input');
        const pinInput = document.getElementById('pin-input');
        const msgEl = document.getElementById('login-msg');
        const btnLogin = document.getElementById('btn-login');

        const nom = nomInput.value.trim();
        const pin = pinInput.value.trim();
        msgEl.innerText = "";

        if (!nom) {
            msgEl.innerText = "Ingrese o escanee un número de nómina.";
            nomInput.focus();
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerText = "VALIDANDO...";

        try {
            let u = null;
            const s = await getDoc(doc(db, "Usuarios", nom));
            if (s.exists()) {
                u = s.data();
            } else if (usersCache[nom] || usersCache[nom.toUpperCase()]) {
                u = usersCache[nom] || usersCache[nom.toUpperCase()];
            }

            if (u) {
                const nivelNorm = String(u.nivel || "").trim().toLowerCase();

                if (nivelNorm === "operador") {
                    startSession(u);
                } else {
                    const pinBox = document.getElementById('pin-box');
                    if (pinBox.style.display === 'none') {
                        pinBox.style.display = 'block';
                        msgEl.innerText = "Usuario Líder: Ingrese su PIN y presione INGRESAR.";
                        pinInput.focus();
                    } else if (String(pin).trim() === String(u.pin || "").trim() && pin !== "") {
                        startSession(u);
                    } else {
                        msgEl.innerText = "PIN de Líder incorrecto.";
                        pinInput.focus();
                    }
                }
            } else {
                msgEl.innerText = `La nómina "${nom}" no existe en la base.`;
            }
        } catch(e) {
            const cached = usersCache[nom] || usersCache[nom.toUpperCase()];
            if (cached && String(cached.nivel || "").trim().toLowerCase() === "operador") {
                startSession(cached);
            } else {
                msgEl.innerText = "Error de red al validar usuario.";
            }
        }

        btnLogin.disabled = false;
        btnLogin.innerText = "INGRESAR";
    }

    function startSession(u) {
        user = u;
        document.getElementById('user-display').innerText = u.nombre || "Operador";
        document.getElementById('ui-login').style.display = 'none';
        document.getElementById('ui-scan').style.display = 'flex';
        updateUIForStep();
    }

    // 3. UI Y FLUJO
    function updateUIForStep() {
        for(let i=1; i<=4; i++) {
            const bar = document.getElementById(`bar-${i}`);
            if(i <= step) bar.classList.add('active');
            else bar.classList.remove('active');
        }

        const title = document.getElementById('header-step-title');
        const mainPrompt = document.getElementById('main-prompt');
        const subPrompt = document.getElementById('sub-prompt');
        const step4View = document.getElementById('step4-container');

        step4View.style.display = 'none';
        mainPrompt.style.display = 'block';
        subPrompt.style.display = 'block';
        document.getElementById('btn-manual-trigger').style.display = 'flex';
        document.getElementById('btn-res').style.display = 'none';
        document.getElementById('btn-finish').style.display = 'none';
        paused = false;

        if(step === 1) {
            title.innerText = "PASO 1: JAMAITA";
            mainPrompt.innerText = "ESPERANDO ESCANEO...";
            subPrompt.innerText = "Escanea la etiqueta Jamaita/Sebango (TABC / TMMBC)";
            focusHardwareScanner();
        } else if(step === 2) {
            title.innerText = "PASO 2: KANBAN";
            mainPrompt.innerText = "ESPERANDO KANBAN...";
            subPrompt.innerText = `JAMAITA: ${jamaita} | CLIENTE: ${clienteFinal}`;
            focusHardwareScanner();
        } else if(step === 3) {
            title.innerText = "PASO 3: QR CLIENTE";
            mainPrompt.innerText = "ESPERANDO QR CLIENTE...";
            subPrompt.innerText = `CLIENTE: ${clienteFinal} | PARTE: ${kanbanParte}`;
            focusHardwareScanner();
        } else if(step === 4) {
            title.innerText = "PASO 4: TEKIN";
            mainPrompt.style.display = 'none';
            subPrompt.style.display = 'none';
            document.getElementById('btn-manual-trigger').style.display = 'none';
            initStep4();
        }
    }

    function focusHardwareScanner() { 
        const wedge = document.getElementById('zebra-wedge-input');
        if (wedge) wedge.focus(); 
    }

    // ==========================================
    // GUARDIÁN DE FOCO AUTOMÁTICO (LOGIN + PASOS 1, 2 Y 3)
    // ==========================================
    setInterval(() => {
        const active = document.activeElement;
        
        if (!user) {
            if (!active || (active.id !== 'nom-input' && active.id !== 'pin-input' && active.tagName !== 'BUTTON')) {
                const pinBox = document.getElementById('pin-box');
                if (pinBox && pinBox.style.display === 'none') {
                    document.getElementById('nom-input').focus();
                } else if (pinBox) {
                    document.getElementById('pin-input').focus();
                }
            }
        } else {
            if ((step === 1 || step === 2 || step === 3) && !paused) {
                if (!active || (active.id !== 'zebra-wedge-input' && active.id !== 'pin-tl' && active.tagName !== 'BUTTON')) {
                    focusHardwareScanner();
                }
            }
        }
    }, 500);

    // ==========================================
    // LECTURA UNIVERSAL DATAWEDGE TC22 (LOGIN + ESCANEO)
    // ==========================================
    const nomInputEl = document.getElementById('nom-input');
    const pinInputEl = document.getElementById('pin-input');

    nomInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 9) {
            e.preventDefault();
            checkLogin();
        }
    });

    pinInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 9) {
            e.preventDefault();
            checkLogin();
        }
    });

    const wedgeInput = document.getElementById('zebra-wedge-input');
    
    function triggerBarcodeProcess(val) {
        val = val.trim();
        wedgeInput.value = "";
        if (val && !paused && (step === 1 || step === 2 || step === 3)) {
            processFound(val);
        }
    }

    wedgeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 9) {
            e.preventDefault();
            triggerBarcodeProcess(wedgeInput.value);
        }
    });

    let inputTimeout;
    wedgeInput.addEventListener('input', () => {
        clearTimeout(inputTimeout);
        inputTimeout = setTimeout(() => {
            const currentVal = wedgeInput.value.trim();
            if (currentVal.length > 2) { 
                triggerBarcodeProcess(currentVal);
            }
        }, 400); 
    });

    // Captura Global para ráfagas de teclado
    let keyBuffer = "", keyTimer = null;
    window.addEventListener('keydown', (e) => {
        const activeId = document.activeElement ? document.activeElement.id : "";

        if (!user) {
            if ((e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 9) && (activeId === 'nom-input' || activeId === 'pin-input')) {
                e.preventDefault();
                checkLogin();
            }
            return;
        }

        if (activeId === 'pin-tl') {
            if (e.key === 'Enter' || e.keyCode === 13) document.getElementById('btn-unlock').click();
            return;
        }

        if (paused && (e.key === 'Enter' || e.keyCode === 13) && document.getElementById('btn-res').style.display === 'block') {
            e.preventDefault();
            document.getElementById('btn-res').click();
            return;
        }

        if (paused || (step !== 1 && step !== 2 && step !== 3) || activeId === 'zebra-wedge-input') return;

        if (e.key === 'Enter' || e.keyCode === 13) {
            if (keyBuffer.trim().length > 0) {
                const scanned = keyBuffer.trim();
                keyBuffer = "";
                processFound(scanned);
            }
        } else if (e.key.length === 1) {
            keyBuffer += e.key;
            clearTimeout(keyTimer);
            keyTimer = setTimeout(() => { keyBuffer = ""; }, 800); 
        }
    });

    document.addEventListener('click', (e) => {
        if (user && (step === 1 || step === 2 || step === 3) && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
            focusHardwareScanner();
        }
    });

    document.addEventListener('touchstart', (e) => {
        if (user && (step === 1 || step === 2 || step === 3) && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
            focusHardwareScanner();
        }
    });

    // Extracción de IDC desde la cadena completa del QR de cliente (TABC / TMMBC)
    function extractIDCFromClientQR(rawQr, expectedIDC) {
        const upperQr = rawQr.toUpperCase();

        // 1. Búsqueda estándar tras "50500" + 2 caracteres de Dock Code (ej. 50500AFACFF...)
        const stdMatch = upperQr.match(/50500[A-Z0-9]{2}([A-Z0-9]{4})/);
        if (stdMatch && stdMatch[1]) {
            if (!expectedIDC || stdMatch[1] === expectedIDC) return stdMatch[1];
        }

        // 2. Posición fija estándar (caracteres 39 a 42 -> índices 38 a 42)
        if (upperQr.length >= 42) {
            const fixedSlice = upperQr.substring(38, 42).trim();
            if (/^[A-Z0-9]{4}$/.test(fixedSlice)) {
                if (!expectedIDC || fixedSlice === expectedIDC) return fixedSlice;
            }
        }

        // 3. Búsqueda directa en toda la cadena del QR por coincidencia con el IDC esperado
        if (expectedIDC && upperQr.includes(expectedIDC)) {
            return expectedIDC;
        }

        return stdMatch ? stdMatch[1] : "";
    }

    // 4. LÓGICA CORE DE VALIDACIÓN
    async function processFound(val) {
        paused = true;
        const rawVal = val.trim();

        // PASO 1: JAMAITA (SEBANGO + FILTRO CLIENTE TABC / TMMBC)
        if (step === 1) {
            const scannedSebango = rawVal.toUpperCase();
            const rowMatch = sheetData.find(row => row[7] && row[7].trim().toUpperCase() === scannedSebango);

            if (!rowMatch) {
                handleStepFailure("SEBANGO NO ENCONTRADO EN BD", "Sebango no registrado en base de datos.");
                return;
            }

            const rowCF = rowMatch[10] ? rowMatch[10].trim().toUpperCase() : "";
            if (!ALLOWED_CLIENTS.has(rowCF)) {
                handleStepFailure(
                    `CLIENTE NO PERMITIDO (${rowCF || "SIN CF"})`,
                    `Este Sebango pertenece a ${rowCF || "otro cliente"}. Solo se permite TABC o TMMBC.`
                );
                return;
            }

            jamaita = scannedSebango;
            clienteFinal = rowCF;

            document.getElementById('main-prompt').innerText = `¡JAMAITA OK!`;
            document.getElementById('sub-prompt').innerText = `${jamaita} (${clienteFinal})`;
            document.getElementById('btn-manual-trigger').style.display = 'none';
            
            logToDB("OK", `Paso 1: Jamaita OK (${jamaita} - ${clienteFinal})`);
            setTimeout(() => { step++; updateUIForStep(); }, 200);
        } 
        // PASO 2: KANBAN INTERNO (ELIMINANDO PREFIJO Y SUFIJO -00)
        else if (step === 2) {
            const parts = rawVal.split('-');
            let parsedPart = rawVal;

            if (parts.length >= 4) {
                parsedPart = parts.slice(1, -1).join('-');
            } else if (parts.length === 3) {
                parsedPart = parts[1];
            } else if (rawVal.includes('-')) {
                parsedPart = rawVal.substring(rawVal.indexOf('-') + 1).trim();
            }
            parsedPart = parsedPart.replace(/-00$/i, '').trim().toUpperCase();

            const matchedRow = sheetData.find(row => {
                const cellH = row[7] ? row[7].trim().toUpperCase() : '';
                const cellJ = row[9] ? row[9].trim().toUpperCase() : '';
                const cellK = row[10] ? row[10].trim().toUpperCase() : '';
                return cellH === jamaita && cellJ === parsedPart && cellK === clienteFinal;
            });

            if (matchedRow) {
                kanbanParte = parsedPart;
                activeSheetRow = matchedRow;
                expectedIdCliente = matchedRow[8] ? matchedRow[8].trim().toUpperCase() : '';

                document.getElementById('main-prompt').innerText = `¡KANBAN OK!`;
                document.getElementById('sub-prompt').innerText = kanbanParte;
                document.getElementById('btn-manual-trigger').style.display = 'none';

                logToDB("OK", `Paso 2: Kanban Parte OK (${kanbanParte})`);
                setTimeout(() => { step++; updateUIForStep(); }, 200); 
            } else {
                handleStepFailure("MEZCLA DE PARTE / SEBANGO", "Número de Parte no coincide con Sebango o Cliente.");
            }
        }
        // PASO 3: QR DE ETIQUETA CLIENTE (EXTRACCIÓN DE IDC Y CRUCE CON COLUMNA IDC Y CF)
        else if (step === 3) {
            const extractedIDC = extractIDCFromClientQR(rawVal, expectedIdCliente);

            const validRow = sheetData.find(row => {
                const cellH = row[7] ? row[7].trim().toUpperCase() : '';
                const cellI = row[8] ? row[8].trim().toUpperCase() : '';
                const cellJ = row[9] ? row[9].trim().toUpperCase() : '';
                const cellK = row[10] ? row[10].trim().toUpperCase() : '';
                return (
                    cellH === jamaita &&
                    cellJ === kanbanParte &&
                    cellK === clienteFinal &&
                    cellI === extractedIDC &&
                    extractedIDC !== "" &&
                    extractedIDC !== "-"
                );
            });

            if (validRow) {
                idCliente = extractedIDC;
                activeSheetRow = validRow;

                try {
                    const s = await getDoc(doc(db, "Maestro_Partes", idCliente));
                    pendingData = s.exists() ? s.data() : {};
                } catch (e) {
                    pendingData = {};
                }

                document.getElementById('main-prompt').innerText = `¡CLIENTE OK!`;
                document.getElementById('sub-prompt').innerText = `IDC: ${idCliente} (${clienteFinal})`;
                document.getElementById('btn-manual-trigger').style.display = 'none';

                logToDB("OK", `Paso 3: QR Cliente OK (${idCliente} - ${clienteFinal})`);
                setTimeout(() => { step++; updateUIForStep(); }, 250);
            } else {
                handleStepFailure(
                    "ID CLIENTE INCORRECTO O MEZCLA",
                    `IDC esperado: ${expectedIdCliente || "N/A"} | Leído: ${extractedIDC || "NO DETECTADO"}`
                );
            }
        }
    }

    document.getElementById('btn-res').addEventListener('click', () => {
        step++;
        updateUIForStep();
    });

    function logToDB(status, msg = "") {
        addDoc(collection(db, "Bitacora_Incidencias"), {
            usuario: user ? user.nombre : "N/A",
            status,
            cliente: clienteFinal || "N/A",
            customer_id: jamaita || "N/A",
            idc: idCliente || "N/A",
            error_msg: msg,
            timestamp: serverTimestamp()
        }).catch(function(e) {});
    }

    function resetCycle() {
        step = 1;
        retryCount = 0;
        jamaita = "";
        kanbanParte = "";
        idCliente = "";
        expectedIdCliente = "";
        clienteFinal = "";
        activeSheetRow = null;
        pendingData = null;
        document.getElementById('retry-counter').innerText = `Intentos: 0/5`;
        updateUIForStep();
    }

    // 5. PASO 4 TEKIN (CON RESPALDO DE GOOGLE SHEET Y OMISIÓN SI ES NA / N/A)
    function getRandomOtherTekin(correctTekin) {
        const distinctTekins = new Set();
        for (let i = 1; i < sheetData.length; i++) {
            const t = sheetData[i][2] ? sheetData[i][2].trim().toUpperCase() : "";
            if (t && t !== "TEKIN" && t !== "NA" && t !== "N/A" && t !== "-" && t !== correctTekin) {
                distinctTekins.add(t);
            }
        }
        const pool = Array.from(distinctTekins);
        if (pool.length === 0) return "OTRO";
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function initStep4() {
        const sheetTekin = activeSheetRow && activeSheetRow[2] ? activeSheetRow[2].trim().toUpperCase() : "";
        const sheetImg = activeSheetRow && activeSheetRow[11] ? activeSheetRow[11].trim() : "";

        const hasFirestoreTekin = pendingData && pendingData.Tekin_OK && !["NA", "N/A", "-"].includes(String(pendingData.Tekin_OK).trim().toUpperCase());
        if (!hasFirestoreTekin && (!sheetTekin || sheetTekin === "NA" || sheetTekin === "N/A" || sheetTekin === "-")) {
            logToDB("OK", `Paso 4: Tekin omitido automáticamente (NA) - ${idCliente}`);
            resetCycle();
            return;
        }

        document.getElementById('step4-container').style.display = 'flex';
        const img = document.getElementById('img-tekin');

        const resolvedImg = (pendingData && pendingData.img_url) ? pendingData.img_url : sheetImg;
        if (resolvedImg && (resolvedImg.startsWith("http") || resolvedImg.startsWith("data:image"))) {
            img.src = resolvedImg;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }

        const t_ok = hasFirestoreTekin ? String(pendingData.Tekin_OK).trim().toUpperCase() : sheetTekin;
        const t_ng = (pendingData && pendingData.Tekin_NG)
            ? String(pendingData.Tekin_NG).trim().toUpperCase()
            : getRandomOtherTekin(t_ok);

        const opts = [t_ok, t_ng].sort(() => Math.random() - 0.5);

        const area = document.getElementById('options-area');
        area.innerHTML = "";

        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = o;
            b.onclick = () => {
                if(o === t_ok) {
                    area.innerHTML = "<h3 style='color:#10b981; grid-column:span 2; text-align:center;'>VALIDADO CORRECTAMENTE</h3>";
                    logToDB("OK", `Paso 4: Tekin Verificado (${t_ok})`);
                    setTimeout(() => {
                        resetCycle();
                    }, 400); 
                } else {
                    handleStepFailure("ERROR SELECCIÓN TEKIN", "Validación Tekin fallida.");
                }
            };
            area.appendChild(b);
        });
    }

    document.getElementById('btn-finish').addEventListener('click', () => {
        resetCycle();
    });

    // 6. MANEJO DE INTENTOS Y BLOQUEO
    function handleStepFailure(lockReason, statusText) {
        retryCount++;
        document.getElementById('retry-counter').innerText = `Intentos: ${retryCount}/5`;

        if (retryCount >= 5) {
            logToDB("NG", "EXCESO DE INTENTOS: " + lockReason);
            document.getElementById('lock-msg').innerText = lockReason;
            document.getElementById('lock').style.display = 'flex';
        } else {
            const pop = document.getElementById('msg-pop');
            pop.innerText = statusText;
            pop.style.display = 'block';
            setTimeout(() => {
                pop.style.display = 'none';
                paused = false;
                if(step === 1 || step === 2 || step === 3) focusHardwareScanner();
            }, 1200); 
        }
    }

    document.getElementById('btn-unlock').addEventListener('click', async () => {
        const p = document.getElementById('pin-tl').value.trim();
        if(!p) return;

        try {
            const q = query(collection(db, "Usuarios"), where("nivel", "==", "Lider"), where("pin", "==", p));
            const s = await getDocs(q);
            if (!s.empty) {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('pin-tl').value = "";
                resetCycle();
            } else {
                document.getElementById('lock-msg').innerText = "PIN INCORRECTO";
            }
        } catch(e) {}
    });

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    initBackgroundResources();
</script>
</body>
</html>
